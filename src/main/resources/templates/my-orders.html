<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>StepUp.in - My Orders</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .orders-container {
            max-width: 900px;
            margin: 50px auto;
        }

        .page-title {
            font-family: 'Playfair Display';
            font-weight: 600;
            margin-bottom: 40px;
            color: #2f4f4f;
        }

        .order-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid #eee;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .order-header {
            padding: 15px 25px;
            background: #fafafa;
            border-bottom: 1px solid #f1f1f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #666;
        }

        .order-body {
            padding: 25px;
            display: flex;
            align-items: center;
        }

        .order-info {
            flex-grow: 1;
        }

        .order-status {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-delivered {
            color: #28a745;
        }

        .status-shipped {
            color: #0d6efd;
        }

        .status-pending {
            color: #ffc107;
        }

        .status-cancelled {
            color: #dc3545;
        }

        .order-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2f4f4f;
        }

        .track-btn {
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .empty-orders {
            text-align: center;
            padding: 80px 20px;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments :: header}"></div>

    <div class="container orders-container">
        <h2 class="page-title text-center">My Orders</h2>

        <div th:if="${orders.empty}" class="empty-orders">
            <img src="https://cdn-icons-png.flaticon.com/512/4555/4555971.png"
                style="width: 100px; opacity: 0.3; margin-bottom: 25px;">
            <h4>No orders yet!</h4>
            <p class="text-muted">Explore our latest shoes and start shopping today.</p>
            <a th:href="@{/products}" class="btn btn-dark px-4 py-2 mt-3 rounded-pill">Shop Now</a>
        </div>

        <div th:each="order : ${orders}" class="order-card">
            <div class="order-header">
                <div>
                    <span>ORDER <span class="fw-bold text-dark" th:text="'#' + ${order.id}">#123</span></span>
                    <span class="ms-3" th:text="${#temporals.format(order.orderDate, 'MMM dd, yyyy')}">Jan 26,
                        2026</span>
                </div>
                <div>
                    <span class="me-2 text-dark fw-medium">Tracking:</span>
                    <span class="badge bg-secondary" th:text="${order.trackingNumber}">TRK987654</span>
                </div>
            </div>
            <div class="order-body">
                <div class="order-info">
                    <div class="mb-2">
                        <span class="order-status"
                            th:classappend="${order.status.name() == 'DELIVERED' ? 'status-delivered' : (order.status.name() == 'CANCELLED' ? 'status-cancelled' : (order.status.name() == 'PENDING' ? 'status-pending' : 'status-shipped'))}"
                            th:text="${order.status}">
                            OUT FOR DELIVERY
                        </span>
                    </div>
                    <div class="order-price" th:text="'₹ ' + ${order.totalAmount}">₹ 2,499</div>
                    <p class="text-muted small mb-0 mt-1"
                        th:text="${#lists.size(order.items)} + ' Items in this order'">1 Item</p>
                </div>
                <div class="order-actions text-end">
                    <a th:href="@{/orders/track/{id}(id=${order.id})}" class="btn btn-outline-dark track-btn">Track
                        Order</a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
